<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Store the requested path so the SPA can redirect to it once loaded.
      sessionStorage.redirect = window.location.href;
      // Redirect to the index page.
      window.location.replace('/portfolio/');
    </script>
  </head>
  <body></body>
</html>
