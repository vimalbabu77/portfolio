<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Simplified redirect for SPA on GitHub Pages
      // Maintains the path, redirecting to the index page for React Router to handle
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/portfolio/' +
        '?p=' + l.pathname.replace(/\/portfolio\//, '') +
        l.search +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
