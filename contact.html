<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Vimal Babu Kalappattil</title>
    <link rel="icon" type="image/png" href="/portfolio/images/VBK-LOGO.png">
    <link href="/src/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#ffffff',
                        foreground: '#111111',
                        border: '#eeeeee',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],

</head>
<body class="bg-white text-[#111] selection:bg-black selection:text-white">

    <main class="pt-32 pb-20 px-6 max-w-6xl mx-auto">

            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-2 uppercase">
                Get in <span class="text-gray-400 font-light">Touch</span>
            </h1>
            <p class="text-lg text-gray-500 w-full">Have a project in mind or want to discuss a new opportunity? I'm just a message away.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Contact Information -->
            <div class="space-y-6">
                <div class="bento-card p-8">
                    <h3 class="text-lg font-bold mb-6 text-black border-b border-gray-100 pb-2">Contact Details</h3>
                    
                    <div class="space-y-6">
                        <!-- Email -->
                        <a href="mailto:vimalbabu77@gmail.com" class="flex items-start gap-4 group">
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center group-hover:bg-black group-hover:text-white transition-colors duration-300 shrink-0">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Email</p>
                                <p class="text-sm font-medium text-black break-all">vimalbabu77@gmail.com</p>
                            </div>
                        </a>

                        <!-- Phone -->
                        <a href="tel:+971566509362" class="flex items-start gap-4 group">
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center group-hover:bg-black group-hover:text-white transition-colors duration-300 shrink-0">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Phone</p>
                                <p class="text-sm font-medium text-black">+971 56 650 9362</p>
                            </div>
                        </a>

                        <!-- WhatsApp -->
                        <a href="https://wa.me/971566509362" target="_blank" rel="noopener noreferrer" class="flex items-start gap-4 group">
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center group-hover:bg-[#25D366] group-hover:text-white transition-colors duration-300 shrink-0">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.536 1.065 2.981 1.214 3.179c.149.198 2.095 3.039 5.076 4.263 2.979 1.225 2.979.816 3.523.766.545-.049 1.758-.718 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">WhatsApp</p>
                                <p class="text-sm font-medium text-black">+971 56 650 9362</p>
                            </div>
                        </a>

                        <!-- LinkedIn -->
                        <a href="https://www.linkedin.com/in/vimalbabu77" target="_blank" rel="noopener noreferrer" class="flex items-start gap-4 group">
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center group-hover:bg-[#0077b5] group-hover:text-white transition-colors duration-300 shrink-0">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">LinkedIn</p>
                                <p class="text-sm font-medium text-black">linkedin.com/in/vimalbabu77</p>
                            </div>
                        </a>

                        <!-- Location -->
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 shrink-0">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Location</p>
                                <p class="text-sm font-medium text-black">Dubai, United Arab Emirates</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contact Form -->
            <div>
                <div class="bento-card p-8">
                    <h3 class="text-lg font-bold mb-6 text-black border-b border-gray-100 pb-2">Send a Message</h3>
                    
                    <form action="https://formsubmit.co/vimalbabu77@gmail.com" method="POST" class="space-y-4">
                        <!-- Spam Protection -->
                        <input type="hidden" name="_captcha" value="false">
                        <input type="hidden" name="_next" value="https://vimalbabu77.github.io/portfolio/contact.html">

                        <div>
                            <label for="name" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Name</label>
                            <input type="text" id="name" name="name" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-all placeholder-gray-300" placeholder="Your Name">
                        </div>

                        <div>
                            <label for="email" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Email</label>
                            <input type="email" id="email" name="email" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-all placeholder-gray-300" placeholder="email@example.com">
                        </div>

                        <div>
                            <label for="subject" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Subject</label>
                            <input type="text" id="subject" name="subject" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-all placeholder-gray-300" placeholder="Project Inquiry">
                        </div>

                        <div>
                            <label for="message" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Message</label>
                            <textarea id="message" name="message" rows="5" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-all placeholder-gray-300 resize-none" placeholder="Tell me about your project..."></textarea>
                        </div>

                        <button type="submit" class="w-full bg-black text-white font-bold py-4 rounded-lg hover:bg-gray-800 transition-all duration-300 shadow-sm hover:shadow-md flex items-center justify-center">
                            Send Message
                            <svg class="ml-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <footer id="global-footer"></footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
